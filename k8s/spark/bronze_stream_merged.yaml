apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: bronze-merged-flink-bureau
  namespace: kubeflow-user-example-com
spec:
  type: Python
  mode: cluster
  image: microwave1005/spark-etl:0.0.1
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/app/bronze_layer/merged_bronze_layer.py
  sparkVersion: 4.0.0
  restartPolicy:
    type: Never
  driver:
    serviceAccount: spark
    cores: 2
    memory: 2g
    annotations:
      sidecar.istio.io/inject: "false"
    envVars:
      MINIO_ENDPOINT: "minio.minio.svc.cluster.local:9000"
      KAFKA_BOOTSTRAP_SERVERS: "kafka-cluster-0-kafka-bootstrap.kafka.svc.cluster.local:9092"
      APPLICATION_TOPIC: "homecredit.record.application"
      MERGED_TOPIC: "flink-merged-bureau"
      SCHEMA_REGISTRY_URL: "http://schema-registry-svc.kafka.svc.cluster.local:8081"
      BRONZE_PATH_APPLICATION: "s3a://bronze/application"
      CHECKPOINT_PATH_APPLICATION: "s3a://checkpoints/application"
      BRONZE_PATH_MERGED: "s3a://bronze/merged"
      CHECKPOINT_PATH_MERGED: "s3a://checkpoints/merged"
    envSecretKeyRefs:
      MINIO_ACCESS_KEY:
        name: minio-creds
        key: access_key
      MINIO_SECRET_KEY:
        name: minio-creds
        key: secret_key
  executor:
    instances: 1
    cores: 1
    memory: 1g
    annotations:
      sidecar.istio.io/inject: "false"
    envVars:
      MINIO_ENDPOINT: "minio.minio.svc.cluster.local:9000"
      KAFKA_BOOTSTRAP_SERVERS: "kafka-cluster-0-kafka-bootstrap.kafka.svc.cluster.local:9092"
      APPLICATION_TOPIC: "homecredit.record.application"
      MERGED_TOPIC: "flink-merged-bureau"
      SCHEMA_REGISTRY_URL: "http://schema-registry-svc.kafka.svc.cluster.local:8081"
      BRONZE_PATH_APPLICATION: "s3a://bronze/application"
      CHECKPOINT_PATH_APPLICATION: "s3a://checkpoints/application"
      BRONZE_PATH_MERGED: "s3a://bronze/merged"
      CHECKPOINT_PATH_MERGED: "s3a://checkpoints/merged"
    envSecretKeyRefs:
      MINIO_ACCESS_KEY:
        name: minio-creds
        key: access_key
      MINIO_SECRET_KEY:
        name: minio-creds
        key: secret_key
    labels:
      version: 4.0.0
  sparkConf:
    spark.default.parallelism: "2"
    spark.sql.shuffle.partitions: "2"
    spark.sql.session.timeZone: "UTC"
    spark.ui.enabled: "true"

    spark.hadoop.fs.s3a.impl: "org.apache.hadoop.fs.s3a.S3AFileSystem"
    spark.hadoop.fs.s3a.endpoint: "http://minio.minio.svc.cluster.local:9000"
    spark.hadoop.fs.s3a.path.style.access: "true"
    spark.hadoop.fs.s3a.connection.ssl.enabled: "false"
    spark.hadoop.fs.s3a.aws.credentials.provider: org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

    spark.hadoop.fs.s3a.connection.timeout: "60000"
    spark.hadoop.fs.s3a.connection.establish.timeout: "60000"
    spark.hadoop.fs.s3a.attempts.maximum: "10"
    spark.hadoop.fs.s3a.connection.maximum: "200"
    spark.hadoop.fs.s3a.paging.maximum: "5000"
    spark.hadoop.fs.s3a.threads.keepalivetime: "60000"
    spark.hadoop.fs.s3a.multipart.purge.age: "60000"
    spark.hadoop.fs.s3a.readahead.range: "65536"

    spark.sql.extensions: "io.delta.sql.DeltaSparkSessionExtension"
    spark.sql.catalog.spark_catalog: "org.apache.spark.sql.delta.catalog.DeltaCatalog"
    spark.databricks.delta.schema.autoMerge.enabled: "true"

    hive.metastore.uris: "thrift://hive-metastore.database.svc.cluster.local:9083"