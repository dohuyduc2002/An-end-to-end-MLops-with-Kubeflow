apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  namespace: database
data:
  init-homecredit-db.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
      CREATE DATABASE homecredit;
    EOSQL

    # Connect to homecredit and create schemas
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "homecredit" <<-EOSQL
      CREATE SCHEMA feast;
      CREATE SCHEMA record;
    EOSQL
