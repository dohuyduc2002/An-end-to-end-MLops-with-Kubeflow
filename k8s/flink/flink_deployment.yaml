apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: flink-merge-streams
  namespace: flink
spec:
  image: microwave1005/flink-merge-streams:0.0.3
  flinkVersion: v2_0
  serviceAccount: flink

  flinkConfiguration:
    python.client.executable: /usr/local/bin/python
    python.executable: /usr/local/bin/python

    pipeline.jars: >
      local:///opt/flink/lib/flink-sql-connector-kafka-4.0.0-2.0.jar,
      local:///opt/flink/lib/flink-avro-confluent-registry-2.0.0.jar,
      local:///opt/flink/lib/flink-json-2.0.0.jar,
      local:///opt/flink/lib/kafka-clients-3.9.0.jar,
      local:///opt/flink/lib/flink-s3-fs-hadoop-2.0.0.jar,
      local:///opt/flink/lib/kafka-schema-registry-client-7.7.0.jar

    taskmanager.numberOfTaskSlots: 4

    # ---------- S3 (MinIO) ----------
    s3.endpoint: http://minio.minio.svc.cluster.local:9000
    s3.path.style.access: "true"
    s3.connection.ssl.enabled: "false"
    s3.aws.credentials.provider: com.amazonaws.auth.EnvironmentVariableCredentialsProvider

    # ---------- State backend + checkpoint/savepoint ----------
    state.backend.type: rocksdb
    execution.checkpointing.dir: s3://flink-data/checkpoints
    execution.checkpointing.savepoint-dir: s3://flink-data/savepoints
    execution.checkpointing.interval: "60s"
    execution.checkpointing.mode: "AT_LEAST_ONCE"
    execution.checkpointing.timeout: "5m"
    execution.checkpointing.min-pause: "2s"

  jobManager:
    replicas: 1
    resource:
      memory: 1024m
      cpu: 0.2
    podTemplate:
      spec:
        containers:
        - name: flink-main-container
          image: microwave1005/flink-merge-streams:0.0.3
          imagePullPolicy: IfNotPresent
          readinessProbe:
            httpGet:
              path: /overview
              port: 8081
            initialDelaySeconds: 45
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom: 
              secretKeyRef:
                name: minio-creds
                key: access_key
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom: 
              secretKeyRef:
                name: minio-creds
                key: secret_key

  taskManager:
    replicas: 1
    resource:
      memory: 1024m
      cpu: 0.2
    podTemplate:
      spec:
        containers:
        - name: flink-main-container
          image: microwave1005/flink-merge-streams:0.0.3
          imagePullPolicy: IfNotPresent
          env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: minio-creds
                key: access_key
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: minio-creds
                key: secret_key

  job:
    jarURI: local:///opt/flink/opt/flink-python-2.0.0.jar
    entryClass: org.apache.flink.client.python.PythonDriver
    args: ["-pyclientexec", "/usr/local/bin/python",
           "-py", "/opt/flink/usrlib/merge_streams.py"]
    parallelism: 2
    upgradeMode: stateless
    state: running
