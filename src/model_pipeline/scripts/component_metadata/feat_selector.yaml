# PIPELINE DEFINITION
# Name: feat-selector
# Inputs:
#    base_mlflow_run_id: system.Artifact
#    df_test_binned_csv: system.Dataset
#    df_train_binned_csv: system.Dataset
#    experiment_name: str
#    minio_access_key: str
#    minio_endpoint: str
#    minio_secret_key: str
#    mlflow_endpoint: str
#    n_features_to_select: str
# Outputs:
#    mlflow_run_id: system.Artifact
#    output_test_csv: system.Dataset
#    output_train_csv: system.Dataset
#    transformer_joblib: system.Artifact
components:
  comp-feat-selector:
    executorLabel: exec-feat-selector
    inputDefinitions:
      artifacts:
        base_mlflow_run_id:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        df_test_binned_csv:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        df_train_binned_csv:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        experiment_name:
          parameterType: STRING
        minio_access_key:
          parameterType: STRING
        minio_endpoint:
          parameterType: STRING
        minio_secret_key:
          parameterType: STRING
        mlflow_endpoint:
          parameterType: STRING
        n_features_to_select:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        mlflow_run_id:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        output_test_csv:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        output_train_csv:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        transformer_joblib:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-feat-selector:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - feat_selector
        command:
        - python3
        - -m
        - kfp.dsl.executor_main
        image: docker.io/microwave1005/kfp_run_image:0.1
pipelineInfo:
  name: feat-selector
root:
  dag:
    outputs:
      artifacts:
        mlflow_run_id:
          artifactSelectors:
          - outputArtifactKey: mlflow_run_id
            producerSubtask: feat-selector
        output_test_csv:
          artifactSelectors:
          - outputArtifactKey: output_test_csv
            producerSubtask: feat-selector
        output_train_csv:
          artifactSelectors:
          - outputArtifactKey: output_train_csv
            producerSubtask: feat-selector
        transformer_joblib:
          artifactSelectors:
          - outputArtifactKey: transformer_joblib
            producerSubtask: feat-selector
    tasks:
      feat-selector:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-feat-selector
        inputs:
          artifacts:
            base_mlflow_run_id:
              componentInputArtifact: base_mlflow_run_id
            df_test_binned_csv:
              componentInputArtifact: df_test_binned_csv
            df_train_binned_csv:
              componentInputArtifact: df_train_binned_csv
          parameters:
            experiment_name:
              componentInputParameter: experiment_name
            minio_access_key:
              componentInputParameter: minio_access_key
            minio_endpoint:
              componentInputParameter: minio_endpoint
            minio_secret_key:
              componentInputParameter: minio_secret_key
            mlflow_endpoint:
              componentInputParameter: mlflow_endpoint
            n_features_to_select:
              componentInputParameter: n_features_to_select
        taskInfo:
          name: feat-selector
  inputDefinitions:
    artifacts:
      base_mlflow_run_id:
        artifactType:
          schemaTitle: system.Artifact
          schemaVersion: 0.0.1
      df_test_binned_csv:
        artifactType:
          schemaTitle: system.Dataset
          schemaVersion: 0.0.1
      df_train_binned_csv:
        artifactType:
          schemaTitle: system.Dataset
          schemaVersion: 0.0.1
    parameters:
      experiment_name:
        parameterType: STRING
      minio_access_key:
        parameterType: STRING
      minio_endpoint:
        parameterType: STRING
      minio_secret_key:
        parameterType: STRING
      mlflow_endpoint:
        parameterType: STRING
      n_features_to_select:
        parameterType: STRING
  outputDefinitions:
    artifacts:
      mlflow_run_id:
        artifactType:
          schemaTitle: system.Artifact
          schemaVersion: 0.0.1
      output_test_csv:
        artifactType:
          schemaTitle: system.Dataset
          schemaVersion: 0.0.1
      output_train_csv:
        artifactType:
          schemaTitle: system.Dataset
          schemaVersion: 0.0.1
      transformer_joblib:
        artifactType:
          schemaTitle: system.Artifact
          schemaVersion: 0.0.1
schemaVersion: 2.1.0
sdkVersion: kfp-2.12.1
