# PIPELINE DEFINITION
# Name: modeling
# Inputs:
#    experiment_name: str
#    minio_access_key: str
#    minio_endpoint: str
#    minio_secret_key: str
#    mlflow_endpoint: str
#    mlflow_run_id: system.Artifact
#    model_type: str
#    processed_test_csv: system.Dataset
#    processed_train_csv: system.Dataset
#    suffix: str
# Outputs:
#    model_joblib: system.Artifact
#    registered_model: system.Artifact
components:
  comp-modeling:
    executorLabel: exec-modeling
    inputDefinitions:
      artifacts:
        mlflow_run_id:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        processed_test_csv:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        processed_train_csv:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        experiment_name:
          parameterType: STRING
        minio_access_key:
          parameterType: STRING
        minio_endpoint:
          parameterType: STRING
        minio_secret_key:
          parameterType: STRING
        mlflow_endpoint:
          parameterType: STRING
        model_type:
          parameterType: STRING
        suffix:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        model_joblib:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        registered_model:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-modeling:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - modeling
        command:
        - python3
        - -m
        - kfp.dsl.executor_main
        image: docker.io/microwave1005/kfp_run_image:0.0.1
pipelineInfo:
  name: modeling
root:
  dag:
    outputs:
      artifacts:
        model_joblib:
          artifactSelectors:
          - outputArtifactKey: model_joblib
            producerSubtask: modeling
        registered_model:
          artifactSelectors:
          - outputArtifactKey: registered_model
            producerSubtask: modeling
    tasks:
      modeling:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-modeling
        inputs:
          artifacts:
            mlflow_run_id:
              componentInputArtifact: mlflow_run_id
            processed_test_csv:
              componentInputArtifact: processed_test_csv
            processed_train_csv:
              componentInputArtifact: processed_train_csv
          parameters:
            experiment_name:
              componentInputParameter: experiment_name
            minio_access_key:
              componentInputParameter: minio_access_key
            minio_endpoint:
              componentInputParameter: minio_endpoint
            minio_secret_key:
              componentInputParameter: minio_secret_key
            mlflow_endpoint:
              componentInputParameter: mlflow_endpoint
            model_type:
              componentInputParameter: model_type
            suffix:
              componentInputParameter: suffix
        taskInfo:
          name: modeling
  inputDefinitions:
    artifacts:
      mlflow_run_id:
        artifactType:
          schemaTitle: system.Artifact
          schemaVersion: 0.0.1
      processed_test_csv:
        artifactType:
          schemaTitle: system.Dataset
          schemaVersion: 0.0.1
      processed_train_csv:
        artifactType:
          schemaTitle: system.Dataset
          schemaVersion: 0.0.1
    parameters:
      experiment_name:
        parameterType: STRING
      minio_access_key:
        parameterType: STRING
      minio_endpoint:
        parameterType: STRING
      minio_secret_key:
        parameterType: STRING
      mlflow_endpoint:
        parameterType: STRING
      model_type:
        parameterType: STRING
      suffix:
        parameterType: STRING
  outputDefinitions:
    artifacts:
      model_joblib:
        artifactType:
          schemaTitle: system.Artifact
          schemaVersion: 0.0.1
      registered_model:
        artifactType:
          schemaTitle: system.Artifact
          schemaVersion: 0.0.1
schemaVersion: 2.1.0
sdkVersion: kfp-2.12.1
