# PIPELINE DEFINITION
# Name: silver-layer-etl
# Inputs:
#    minio_access_key: str
#    minio_bucket: str
#    minio_endpoint: str
#    minio_secret_key: str
#    namespace: str
#    yaml_object: str
# Outputs:
#    final_status: system.Dataset
#    submitted_spec: system.Artifact
components:
  comp-silver-layer-etl:
    executorLabel: exec-silver-layer-etl
    inputDefinitions:
      parameters:
        minio_access_key:
          parameterType: STRING
        minio_bucket:
          parameterType: STRING
        minio_endpoint:
          parameterType: STRING
        minio_secret_key:
          parameterType: STRING
        namespace:
          parameterType: STRING
        yaml_object:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        final_status:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        submitted_spec:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-silver-layer-etl:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - silver_layer_etl
        command:
        - python3
        - -m
        - kfp.dsl.executor_main
        image: docker.io/microwave1005/kfp-etl:0.0.1
pipelineInfo:
  name: silver-layer-etl
root:
  dag:
    outputs:
      artifacts:
        final_status:
          artifactSelectors:
          - outputArtifactKey: final_status
            producerSubtask: silver-layer-etl
        submitted_spec:
          artifactSelectors:
          - outputArtifactKey: submitted_spec
            producerSubtask: silver-layer-etl
    tasks:
      silver-layer-etl:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-silver-layer-etl
        inputs:
          parameters:
            minio_access_key:
              componentInputParameter: minio_access_key
            minio_bucket:
              componentInputParameter: minio_bucket
            minio_endpoint:
              componentInputParameter: minio_endpoint
            minio_secret_key:
              componentInputParameter: minio_secret_key
            namespace:
              componentInputParameter: namespace
            yaml_object:
              componentInputParameter: yaml_object
        taskInfo:
          name: silver-layer-etl
  inputDefinitions:
    parameters:
      minio_access_key:
        parameterType: STRING
      minio_bucket:
        parameterType: STRING
      minio_endpoint:
        parameterType: STRING
      minio_secret_key:
        parameterType: STRING
      namespace:
        parameterType: STRING
      yaml_object:
        parameterType: STRING
  outputDefinitions:
    artifacts:
      final_status:
        artifactType:
          schemaTitle: system.Dataset
          schemaVersion: 0.0.1
      submitted_spec:
        artifactType:
          schemaTitle: system.Artifact
          schemaVersion: 0.0.1
schemaVersion: 2.1.0
sdkVersion: kfp-2.12.1
