# PIPELINE DEFINITION
# Name: etl-pipeline
# Description: ETL Pipeline with spark
# Inputs:
#    application_silver_manifest: str
#    data_mart_gold_manifest: str
#    merged_silver_manifest: str
#    minio_access_key: str
#    minio_bucket: str
#    minio_endpoint: str
#    minio_secret_key: str
#    namespace: str
#    slack_bot_token: str
#    slack_channel: str
#    spark_sa_manifest: str
components:
  comp-apply-rbac-spark:
    executorLabel: exec-apply-rbac-spark
    inputDefinitions:
      parameters:
        minio_access_key:
          parameterType: STRING
        minio_bucket:
          parameterType: STRING
        minio_endpoint:
          parameterType: STRING
        minio_secret_key:
          parameterType: STRING
        namespace:
          parameterType: STRING
        yaml_object:
          parameterType: STRING
  comp-gold-layer-etl:
    executorLabel: exec-gold-layer-etl
    inputDefinitions:
      artifacts:
        application_silver_status:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        merged_silver_status:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        minio_access_key:
          parameterType: STRING
        minio_bucket:
          parameterType: STRING
        minio_endpoint:
          parameterType: STRING
        minio_secret_key:
          parameterType: STRING
        namespace:
          parameterType: STRING
        yaml_object:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        final_status:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        submitted_spec:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-silver-layer-etl:
    executorLabel: exec-silver-layer-etl
    inputDefinitions:
      parameters:
        minio_access_key:
          parameterType: STRING
        minio_bucket:
          parameterType: STRING
        minio_endpoint:
          parameterType: STRING
        minio_secret_key:
          parameterType: STRING
        namespace:
          parameterType: STRING
        yaml_object:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        final_status:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        submitted_spec:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-silver-layer-etl-2:
    executorLabel: exec-silver-layer-etl-2
    inputDefinitions:
      parameters:
        minio_access_key:
          parameterType: STRING
        minio_bucket:
          parameterType: STRING
        minio_endpoint:
          parameterType: STRING
        minio_secret_key:
          parameterType: STRING
        namespace:
          parameterType: STRING
        yaml_object:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        final_status:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        submitted_spec:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-slack-notification:
    executorLabel: exec-slack-notification
    inputDefinitions:
      parameters:
        message:
          parameterType: STRING
        slack_bot_token:
          parameterType: STRING
        slack_channel:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-apply-rbac-spark:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - apply_rbac_spark
        command:
        - python3
        - -m
        - kfp.dsl.executor_main
        image: docker.io/microwave1005/kfp-etl:0.0.1
    exec-gold-layer-etl:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - gold_layer_etl
        command:
        - python3
        - -m
        - kfp.dsl.executor_main
        image: docker.io/microwave1005/kfp-etl:0.0.1
    exec-silver-layer-etl:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - silver_layer_etl
        command:
        - python3
        - -m
        - kfp.dsl.executor_main
        image: docker.io/microwave1005/kfp-etl:0.0.1
    exec-silver-layer-etl-2:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - silver_layer_etl
        command:
        - python3
        - -m
        - kfp.dsl.executor_main
        image: docker.io/microwave1005/kfp-etl:0.0.1
    exec-slack-notification:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - slack_notification
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'slack_sdk' &&\
          \ \"$0\" \"$@\"\n"
        - python3
        - -m
        - kfp.dsl.executor_main
        image: docker.io/microwave1005/kfp-etl:0.0.1
pipelineInfo:
  description: ETL Pipeline with spark
  name: etl-pipeline
root:
  dag:
    tasks:
      apply-rbac-spark:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-apply-rbac-spark
        inputs:
          parameters:
            minio_access_key:
              componentInputParameter: minio_access_key
            minio_bucket:
              componentInputParameter: minio_bucket
            minio_endpoint:
              componentInputParameter: minio_endpoint
            minio_secret_key:
              componentInputParameter: minio_secret_key
            namespace:
              componentInputParameter: namespace
            yaml_object:
              componentInputParameter: spark_sa_manifest
        taskInfo:
          name: Setup Spark RBAC
      gold-layer-etl:
        cachingOptions: {}
        componentRef:
          name: comp-gold-layer-etl
        dependentTasks:
        - silver-layer-etl
        - silver-layer-etl-2
        inputs:
          artifacts:
            application_silver_status:
              taskOutputArtifact:
                outputArtifactKey: final_status
                producerTask: silver-layer-etl
            merged_silver_status:
              taskOutputArtifact:
                outputArtifactKey: final_status
                producerTask: silver-layer-etl-2
          parameters:
            minio_access_key:
              componentInputParameter: minio_access_key
            minio_bucket:
              componentInputParameter: minio_bucket
            minio_endpoint:
              componentInputParameter: minio_endpoint
            minio_secret_key:
              componentInputParameter: minio_secret_key
            namespace:
              componentInputParameter: namespace
            yaml_object:
              componentInputParameter: data_mart_gold_manifest
        taskInfo:
          name: 'gold: data_mart'
      silver-layer-etl:
        cachingOptions: {}
        componentRef:
          name: comp-silver-layer-etl
        dependentTasks:
        - apply-rbac-spark
        inputs:
          parameters:
            minio_access_key:
              componentInputParameter: minio_access_key
            minio_bucket:
              componentInputParameter: minio_bucket
            minio_endpoint:
              componentInputParameter: minio_endpoint
            minio_secret_key:
              componentInputParameter: minio_secret_key
            namespace:
              componentInputParameter: namespace
            yaml_object:
              componentInputParameter: application_silver_manifest
        taskInfo:
          name: 'silver: application'
      silver-layer-etl-2:
        cachingOptions: {}
        componentRef:
          name: comp-silver-layer-etl-2
        dependentTasks:
        - apply-rbac-spark
        inputs:
          parameters:
            minio_access_key:
              componentInputParameter: minio_access_key
            minio_bucket:
              componentInputParameter: minio_bucket
            minio_endpoint:
              componentInputParameter: minio_endpoint
            minio_secret_key:
              componentInputParameter: minio_secret_key
            namespace:
              componentInputParameter: namespace
            yaml_object:
              componentInputParameter: merged_silver_manifest
        taskInfo:
          name: 'silver: merged'
      slack-notification:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-slack-notification
        dependentTasks:
        - gold-layer-etl
        inputs:
          parameters:
            message:
              runtimeValue:
                constant: ETL Pipeline completed successfully
            slack_bot_token:
              componentInputParameter: slack_bot_token
            slack_channel:
              componentInputParameter: slack_channel
        taskInfo:
          name: slack-notification
  inputDefinitions:
    parameters:
      application_silver_manifest:
        parameterType: STRING
      data_mart_gold_manifest:
        parameterType: STRING
      merged_silver_manifest:
        parameterType: STRING
      minio_access_key:
        parameterType: STRING
      minio_bucket:
        parameterType: STRING
      minio_endpoint:
        parameterType: STRING
      minio_secret_key:
        parameterType: STRING
      namespace:
        parameterType: STRING
      slack_bot_token:
        parameterType: STRING
      slack_channel:
        parameterType: STRING
      spark_sa_manifest:
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.12.1
