apiVersion: v1
kind: Secret
metadata:
  name: feast-data-stores
stringData:
  postgres: |
    host: {{ .Values.postgres.host }}
    port: 5432
    database: {{ .Values.postgres.db }}
    db_schema: {{ .Values.postgres.schema }}
    user: {{ .Values.postgres.user }}
    password: {{ .Values.postgres.password }}
  spark: |
    spark_conf:
      spark.master: "local[*]"
      spark.driver.memory: "2g"
      spark.driver.maxResultSize: "1g"
      
      spark.ui.enabled: "false"
      spark.eventLog.enabled: "false"
      spark.sql.catalogImplementation: "hive"
      spark.sql.parser.quotedRegexColumnNames: "true"
      spark.sql.session.timeZone: "UTC"
      spark.sql.execution.arrow.fallback.enabled: "true"
      spark.sql.execution.arrow.pyspark.enabled: "true"

      spark.hadoop.fs.s3a.endpoint: "http://minio.minio.svc.cluster.local:9000"
      spark.hadoop.fs.s3a.impl: "org.apache.hadoop.fs.s3a.S3AFileSystem"
      spark.hadoop.fs.s3a.path.style.access: "true"
      spark.hadoop.fs.s3a.connection.ssl.enabled: "false"
      spark.hadoop.fs.s3a.access.key: "minio"
      spark.hadoop.fs.s3a.secret.key: "minio123"
      spark.hadoop.fs.s3a.aws.credentials.provider: "org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider"
      spark.hadoop.fs.s3a.endpoint.region: "us-east-1"
      
      spark.jars: "/opt/spark/jars/hadoop-aws-3.3.4.jar,/opt/spark/jars/hadoop-common-3.3.4.jar,/opt/spark/jars/aws-java-sdk-bundle-1.12.261.jar,/opt/spark/jars/woodstox-core-6.5.1.jar,/opt/spark/jars/stax2-api-4.2.1.jar"

  sql: |
    path: postgresql+psycopg://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@{{ .Values.postgres.host }}:5432/{{ .Values.postgres.db }}
    cache_ttl_seconds: 60
    sqlalchemy_config_kwargs:
        echo: false
        pool_pre_ping: true
---
apiVersion: v1 
kind: Secret
metadata:
  name: minio-creds
stringData:
  AWS_ACCESS_KEY_ID: minio
  AWS_SECRET_ACCESS_KEY: minio123
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-creds
  labels:
    app: postgres
stringData:
  POSTGRES_DB: {{ .Values.postgres.db | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_HOST: {{ .Values.postgres.host | quote }}


