{{- range .Values.kafkaTopics }}
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnector
metadata:
  name: minio-sink-connector-{{ .connector }}
  namespace: {{ $.Values.general.namespace }}
  labels:
    strimzi.io/cluster: connect-cluster
spec:
  class: io.confluent.connect.s3.S3SinkConnector
  tasksMax: 1
  config:
    topics: "{{ .name }}"
    s3.credentials.provider.class: com.amazonaws.auth.EnvironmentVariableCredentialsProvider
    s3.bucket.name: stream-bucket
    s3.region: us-west-1
    store.url: http://minio.minio.svc.cluster.local:9000
    s3.part.size: {{ $.Values.minio.s3PartSize }}
    flush.size: {{ $.Values.minio.flushSize }}
    storage.class: io.confluent.connect.s3.storage.S3Storage
    format.class: io.confluent.connect.s3.format.avro.AvroFormat

---
{{- end }}
