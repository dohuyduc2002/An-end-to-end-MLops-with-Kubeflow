{{- range .Values.kafkaTopics }}
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnector
metadata:
  name: gcs-sink-connector-{{ .name }}
  namespace: {{ $.Values.general.namespace }}
  labels:
    strimzi.io/cluster: connect-cluster
spec:
  class: com.wepay.kafka.connect.bigquery.BigQuerySinkConnector
  tasksMax: 1
  config:
    topics: "{{ .name }}"
    tasks.max: 1
    autoCreateTables: true
    allowNewBigQueryFields: true
    allowBigQueryRequiredFieldRelaxation: true
    schemaRetriever: com.wepay.kafka.connect.bigquery.retrieve.KafkaSchemaRetriever
    project: homecredit_ds
    defaultDataset: "{{ .name }}"
    keyfile: "/mnt/creds/gcp-key.json"
{{- end }}
