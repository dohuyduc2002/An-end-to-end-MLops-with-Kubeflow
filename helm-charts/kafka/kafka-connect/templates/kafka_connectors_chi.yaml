{{- range .Values.kafkaTopics }}
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnector
metadata:
  name: chi-sink-connector-{{ .name }}
  namespace: {{ $.Values.general.namespace }}
  labels:
    strimzi.io/cluster: connect-cluster
spec:
  class: com.clickhouse.kafka.connect.ClickHouseSinkConnector
  tasksMax: 1
  config:
    topics: "{{ .name }}"
    topic2TableMap: "{{ .name }}={{ .mapping }}"
    hostname: chi-stream-chi-cluster-0-0.database.svc.cluster.local
    port: 8123
    database: {{ $.Values.chi.database }}
    username: {{ $.Values.chi.username }}
    password: {{ $.Values.chi.password }}
    key.converter: "org.apache.kafka.connect.json.JsonConverter"
    value.converter: "io.confluent.connect.avro.AvroConverter"
    value.converter.schema.registry.url: "http://schema-registry-svc:8081"
    value.converter.schemas.enable: "true"
    flush.size: {{ $.Values.chi.flushSize }}
---
{{- end }}
