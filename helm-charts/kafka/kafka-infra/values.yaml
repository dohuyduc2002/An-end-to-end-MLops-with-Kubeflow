general:
  namespace: kafka

kafkaClusterName: kafka-cluster-0

controller:
  name: controller
  replicas: 1
  storage:
    type: jbod
    size: 10Gi
    deleteClaim: false

broker:
  name: broker
  replicas: 1
  storage:
    type: jbod
    size: 10Gi
    deleteClaim: false

kafka:
  version: 4.0.0
  metadataVersion: 4.0-IV3
  listeners:
    plain:
      port: 9092
    clusterip:
      port: 9094
  config:
    offsetsReplicationFactor: 1
    txnReplicationFactor: 1
    txnMinIsr: 1
    defaultReplicationFactor: 1
    minInsyncReplicas: 1

kafkaUi:
  enabled: true
  image:
    repository: provectuslabs/kafka-ui
    tag: latest
    pullPolicy: IfNotPresent
  envs:
    config:
      KAFKA_CLUSTERS_0_NAME: kafka-cluster-0
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-cluster-0-kafka-bootstrap:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry-svc:8081

  ingress:
    enabled: true
    host: kafka.ducdh.com
    ingressClassName: nginx
    annotations: {}
    tls: []

schemaRegistry:
  name: schema-registry
  replicas: 1
  image: confluentinc/cp-schema-registry:7.5.0
  imagePullPolicy: IfNotPresent
  port: 8081
  listeners: http://0.0.0.0:8081
  svcType: ClusterIP
  svcName: schema-registry-svc
  ingressName: schema-registry-ingress
  ingressClass: nginx