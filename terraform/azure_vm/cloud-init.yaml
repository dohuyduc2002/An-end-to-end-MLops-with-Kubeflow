#cloud-config
package_update: true
package_upgrade: true
packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - git

write_files: # settings for Elasticsearch, refer to https://www.elastic.co/docs/deploy-manage/deploy/self-managed/vm-max-map-count
  - path: /etc/sysctl.d/99-elasticsearch.conf
    content: |
      vm.max_map_count = 262144

runcmd:
  # 1. Docker + Compose plugin
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
  - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin git

  # 2. add user to docker group 
  - usermod -aG docker ducdh

  # 3. Apply sysctl settings for Elasticsearch
  - sysctl --system

  # 4. Clone docker-elk
  - mkdir -p /home/ducdh/docker-elk
  - git clone https://github.com/dohuyduc2002/docker-elk.git /home/ducdh/docker-elk
  - chown -R ducdh:ducdh /home/ducdh/docker-elk

  # 5. add kubeflow, minio, mlflow to /etc/hosts for CICD 
  - echo "34.28.121.76 kubeflow.ducdh.com" >> /etc/hosts
  - echo "34.45.118.202 minio.ducdh.com" >> /etc/hosts
  - echo "34.45.118.202 mlflow.ducdh.com" >> /etc/hosts
  - echo "34.72.45.193 evidently.ducdh.com" >> /etc/hosts

  # 6. Create Jenkins home directory
  - mkdir -p /var/jenkins_home

  # 7. Enable + start Docker
  - systemctl enable docker
  - systemctl start docker

  # 8. Start Jenkins container
  - |
    docker run -d \
      --restart=unless-stopped \
      -p 8080:8080 \
      -p 50000:50000 \
      --name jenkins \
      --user root \
      -v /etc/hosts:/etc/hosts:ro \
      -v /var/jenkins_home:/var/jenkins_home \
      -v /var/run/docker.sock:/var/run/docker.sock \
      microwave1005/custom-jenkins

  # 9.Start docker-elk 
  - docker compose -f /home/ducdh/docker-elk/docker-compose.yml --profile=setup up setup
  - docker compose -f /home/ducdh/docker-elk/docker-compose.yml up -d 
